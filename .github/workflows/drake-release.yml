name: Drake Release

# Compila con Gradle. Antes llamaba a Maven y montaba dependencias de drakes-slimefun-labs para un
# pom.xml que ya no existe desde la importacion de la base NetworksExpansion (Igdrassil).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ej. v11.0.0-drake.1)"
        required: true
        default: "v11.0.0-drake.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test · Build · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout NetworksV6-drake
        uses: actions/checkout@v7

      # Java 25 solo para paperCompat: la API de Paper 26.x esta compilada para Java 25.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # El ultimo setup-java define JAVA_HOME: Gradle y el jar del plugin usan Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew --no-daemon test

      # No se publica un release que no compile contra las APIs de Paper soportadas.
      - name: Compatibilidad con Paper 1.21.11, 26.1 y 26.2
        run: >-
          ./gradlew --no-daemon paperCompat
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Empaquetar plugin
        run: ./gradlew --no-daemon shadowJar

      - name: Preparar asset de release
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          # El jar del plugin es el de shadowJar (NetworksV6-Drake-*). El otro de build/libs es el
          # jar normal, sin dependencias empaquetadas ni relocalizadas: no sirve en un servidor.
          SRC="$(ls build/libs/NetworksV6-Drake-*.jar)"
          jar tf "$SRC" | grep -q '^plugin.yml$'
          jar tf "$SRC" | grep -q '^io/github/sefiraat/networks/Networks.class$'
          jar tf "$SRC" | grep -q '^io/github/sefiraat/networks/bstats/bukkit/Metrics.class$'
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          OUT="NetworksV6-Drake-${TAG}.jar"
          cp "$SRC" "$OUT"
          echo "asset_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: NetworksV6-Drake ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ steps.asset.outputs.asset_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
