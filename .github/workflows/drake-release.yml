name: Drake Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ej. v11.0.0-drake.1)"
        required: true
        default: "v11.0.0-drake.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Test · Build · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NetworksV6-drake
        uses: actions/checkout@v7

      - name: Checkout foundry (drakes-slimefun-labs)
        uses: actions/checkout@v7
        with:
          repository: DrakesCraft-Labs/drakes-slimefun-labs
          path: drakes-slimefun-labs
          ref: main

      - name: Checkout Slimefun core
        uses: actions/checkout@v7
        with:
          repository: DrakesCraft-Labs/Slimefun4-Drake
          path: slimefun-core
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven settings (GitHub Packages)
        env:
          MAVEN_USER: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-drakes-foundry</id>
                <username>MAVEN_USER_PLACEHOLDER</username>
                <password>MAVEN_TOKEN_PLACEHOLDER</password>
              </server>
            </servers>
          </settings>
          EOF
          sed -i "s/MAVEN_USER_PLACEHOLDER/${MAVEN_USER}/g" ~/.m2/settings.xml
          sed -i "s/MAVEN_TOKEN_PLACEHOLDER/${MAVEN_TOKEN}/g" ~/.m2/settings.xml

      - name: Instalar dependencias Drake en .m2
        working-directory: drakes-slimefun-labs
        run: |
          mvn -B -ntp -DskipTests -f sources/internal-metadata/patches/commons-lang-drake-patched/pom.xml install
          mvn -B -ntp -DskipTests -f sources/dough-core/pom.xml install
          mvn -B -ntp -DskipTests -f ../slimefun-core/pom.xml install
          mvn -B -ntp -DskipTests -f sources/batch-2-expansion/SefiLib/pom.xml install
          mvn -B -ntp -DskipTests -f sources/repos-to-port/InfinityExpansion/pom.xml install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests unitarios
        run: mvn -B -ntp test

      - name: Empaquetar plugin
        run: mvn -B -ntp -DskipTests package

      - name: Preparar asset de release
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/NetworksV6-Drake-v11-SNAPSHOT.jar"
          if [ ! -f "$SRC" ]; then
            echo "No se encontró $SRC"
            exit 1
          fi
          jar tf "$SRC" | grep -q '^dev/drake/dough/collections/Pair.class$'
          ! jar tf "$SRC" | grep -q '^dev/drake/dough/protection/Interaction.class$'
          jar tf "$SRC" | grep -q '^dev/drake/sefilib/persistence/PersistenceTypes.class$'
          jar tf "$SRC" | grep -q '^io/github/sefiraat/networks/libs/xseries/'
          jar tf "$SRC" | grep -q '^io/github/sefiraat/networks/libs/bstats/bukkit/Metrics.class$'
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.tag }}"
          fi
          OUT="NetworksV6-Drake-${TAG}.jar"
          cp "$SRC" "$OUT"
          echo "asset_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: NetworksV6-Drake ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ steps.asset.outputs.asset_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
