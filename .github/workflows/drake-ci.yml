name: Drake CI

# El proyecto se compila con Gradle desde que se importo la base NetworksExpansion (Igdrassil).
# Este workflow seguia llamando a Maven (mvn test / package) y montando dependencias de
# drakes-slimefun-labs para un pom.xml que ya no existe: fallaba en cada push antes de compilar nada.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: drake-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout NetworksV6-drake
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew --no-daemon test

      - name: Empaquetar plugin
        run: ./gradlew --no-daemon shadowJar

      - name: Verificar JAR de producción
        run: |
          JAR=$(ls build/libs/NetworksV6-Drake-*.jar)
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^io/github/sefiraat/networks/Networks.class$'
          jar tf "$JAR" | grep -q '^io/github/sefiraat/networks/bstats/bukkit/Metrics.class$'
          ls -lh "$JAR"

      - name: Subir artefacto CI
        uses: actions/upload-artifact@v7
        with:
          name: NetworksV6-Drake-SNAPSHOT
          path: build/libs/NetworksV6-Drake-*.jar
          if-no-files-found: error

  # Un job por version de la API de Paper: cada una aparece como un check propio en el PR y en el
  # commit, y si falla una se ve cual. fail-fast desactivado para que una version rota no cancele
  # las demas.
  paper-compat:
    name: Paper API ${{ matrix.paper }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: "1.21.11"
            task: compileAgainstPaper1_21_11
          - paper: "26.1"
            task: compileAgainstPaper26_1
          - paper: "26.2"
            task: compileAgainstPaper26_2
    steps:
      - name: Checkout NetworksV6-drake
        uses: actions/checkout@v7

      # Java 25: la API de Paper 26.x esta compilada para Java 25 y la tarea compila con ese JDK.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # El ultimo setup-java define JAVA_HOME: Gradle corre con Java 21, como el build normal.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar contra paper-api ${{ matrix.paper }}
        run: >-
          ./gradlew --no-daemon ${{ matrix.task }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false
