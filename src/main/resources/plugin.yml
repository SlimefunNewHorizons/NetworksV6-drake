name: NetworksV6-Drake
authors: [Sefiraat, Chagui68, mmmjjkx, DrakesCraft-Labs]
description: Networks V6 ported and stabilized for Drake Labs 1.21.x.
main: io.github.sefiraat.networks.Networks
website: https://github.com/DrakesCraft-Labs/NetworksV6-drake
version: ${project.version}
api-version: "1.21"

# Paper descarga esto la primera vez y lo pone en el classpath del plugin, en vez de
# empaquetarlo. Solo lo usa el espejo SQL opcional del quantum storage.
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
depend:
  - Slimefun
softdepend:
  - InfinityExpansion
  - Netheopoiesis
  - InfinityExpansion2
  - Supreme
  - Cultivation
  - GeneticChickengineering
  - DynaTech
  - SlimyTreeTaps
  - ElectricSpawners
  - ExtraTools
  - TranscEndence
  - FluffyMachines
  - FoxyMachines
  - GlobalWarming
  - SlimefunWarfare
  - Liquid
  - AlchimiaVitae
  - FNAmplifications
  - ElementManipulation
  - SlimeHUD
  - WildChests
  - WeaponsAddon
commands:
  networks:
    description: /networks
    usage: /networks <sub>
    permission: networks.admin
permissions:
  networks.admin:
    description: Allows Networks diagnostics, repair and maintenance commands.
    default: op
