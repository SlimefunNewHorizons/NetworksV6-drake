name: NetworksV6-Drake
authors: [Sefiraat, balugaq, ytdd9527, Chagui68, mmmjjkx, DrakesCraft-Labs]
description: Networks V6 (Drake edition) on the NetworksExpansion base, stabilized for DrakesCraft 1.21.x.
main: io.github.sefiraat.networks.Networks
website: https://github.com/SlimefunNewHorizons/NetworksV6-drake
version: ${version}
api-version: "1.21"

# Identidad de produccion: el nombre fija la carpeta de datos (plugins/NetworksV6-Drake) y el namespace de las
# claves. NO cambiarlo: con otro nombre el quantum storage y la config quedarian huerfanos. Lo valida PluginYmlTest.

# Paper descarga esto la primera vez y lo pone en el classpath del plugin, en vez de
# empaquetarlo. Solo lo usa el espejo SQL opcional del quantum storage.
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
depend:
  - Slimefun
softdepend:
  - InfinityExpansion
  - Netheopoiesis
  - InfinityExpansion2
  - Supreme
  - Cultivation
  - GeneticChickengineering
  - DynaTech
  - SlimyTreeTaps
  - ElectricSpawners
  - ExtraTools
  - TranscEndence
  - FluffyMachines
  - FoxyMachines
  - GlobalWarming
  - SlimefunWarfare
  - Liquid
  - AlchimiaVitae
  - FNAmplifications
  - ElementManipulation
  - SlimeHUD
  - WildChests
  - WeaponsAddon
  - RoseStacker
  - WildStacker
  - mcMMO
  - GuguSlimefunLib
  - FinalTECH
  - FinalTECH-Changed
#  - JustEnoughGuide # Don't add this line, see https://github.com/balugaq/JustEnoughGuide/blob/master/src/main/java/com/balugaq/jeg/implementation/ThirdPartyWarnings.java
commands:
  networks:
    aliases: networksexpansion
    description: /networks
    usage: /networks <sub>
    permission: networks.admin

permissions:
  networks.admin:
    description: Allows Networks diagnostics, repair and maintenance commands.
    default: op
  networks.commands.help:
    description: Allows you to use the /networks help command
    default: op
  networks.commands.fillquantum:
    description: Allows you to use the /networks fillquantum command
    default: op
  networks.commands.fixblueprint:
    description: Allows you to use the /networks fixblueprint command
    default: op
  networks.commands.restore:
    description: Allows you to use the /networks restore command
    default: op
  networks.commands.addstorageitem:
    description: Allows you to use the /networks addstorageitem command
    default: op
  networks.commands.reducestorageitem:
    description: Allows you to use the /networks reducestorageitem command
    default: op
  networks.commands.setquantum:
    description: Allows you to use the /networks setquantum command
    default: op
  networks.commands.setcontainerid:
    description: Allows you to use the /networks setcontainerid command
    default: op
  networks.commands.updateitem:
    description: Allows you to use the /networks updateitem command
    default: op
  networks.commands.findcachedstorages:
    description: Allows you to use the /networks findcachedstorages command
    default: op
  networks.commands.getstorageitem:
    description: Allows you to use the /networks getstorageitem command
    default: op
  networks.commands.map:
    description: Allows you to use the /networks map command
    default: op
