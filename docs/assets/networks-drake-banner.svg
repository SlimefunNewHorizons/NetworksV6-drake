<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="NetworksV6 Drake">
  <style>
    .border-glow {
      animation: borderPulse 4s ease-in-out infinite;
    }
    .core-pulse {
      animation: corePulse 5s ease-in-out infinite;
      transform-origin: 720px 110px;
    }
    .node-glow {
      animation: nodePulse 2s ease-in-out infinite;
    }
    .data-flow-1 {
      stroke-dasharray: 9 7;
      animation: flowForward 2s linear infinite;
    }
    .data-flow-2 {
      stroke-dasharray: 4 6;
      animation: flowForward 3s linear infinite;
    }
    .star-twinkle {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes borderPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.55; }
    }
    @keyframes corePulse {
      0%, 100% { transform: scale(0.9); opacity: 0.1; }
      50% { transform: scale(1.1); opacity: 0.28; }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes flowForward {
      to { stroke-dashoffset: -32; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="50%" stop-color="#150a24"/>
      <stop offset="100%" stop-color="#1f1035"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="218" rx="13" fill="none" stroke="#c9a227" stroke-width="1.2" class="border-glow"/>
  
  <!-- Cosmic Background Stars -->
  <g fill="#ffffff">
    <circle cx="160" cy="40" r="1.5" class="star-twinkle" style="animation-delay: 0.2s;"/>
    <circle cx="340" cy="180" r="1.2" class="star-twinkle" style="animation-delay: 1.1s;"/>
    <circle cx="520" cy="30" r="1.6" class="star-twinkle" style="animation-delay: 2s;"/>
    <circle cx="830" cy="190" r="1.3" class="star-twinkle" style="animation-delay: 0.7s;"/>
  </g>

  <g opacity="0.12" stroke="#c4b5fd" stroke-width="0.6">
    <path d="M0 55H920M0 110H920M0 165H920"/>
    <path d="M115 0V220M230 0V220M345 0V220M460 0V220M575 0V220M690 0V220M805 0V220"/>
  </g>
  <circle cx="720" cy="110" r="52" fill="#7c3aed" class="core-pulse"/>
  <circle cx="200" cy="78" r="10" fill="#4c1d95" stroke="#d4af37" stroke-width="2" class="node-glow" style="animation-delay: 0s;"/>
  <circle cx="310" cy="140" r="12" fill="#5b21b6" stroke="#d4af37" stroke-width="2" class="node-glow" style="animation-delay: 0.4s;"/>
  <circle cx="430" cy="72" r="11" fill="#6d28d9" stroke="#f5d76e" stroke-width="2" class="node-glow" style="animation-delay: 0.8s;"/>
  <circle cx="540" cy="128" r="13" fill="#7c3aed" stroke="#c9a227" stroke-width="2" class="node-glow" style="animation-delay: 1.2s;"/>
  <circle cx="650" cy="88" r="10" fill="#581c87" stroke="#e9d5ff" stroke-width="2" class="node-glow" style="animation-delay: 1.6s;"/>
  <circle cx="760" cy="118" r="16" fill="url(#violet)" stroke="#f5d76e" stroke-width="3" class="node-glow" style="animation-delay: 2s;"/>
  <path fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"
        d="M200 78L310 140L430 72L540 128L650 88L760 118" class="data-flow-1"/>
  <path fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"
        d="M310 140L430 72M540 128L650 88" class="data-flow-2"/>
  <text x="48" y="98" fill="#f5d76e" font-family="system-ui,sans-serif" font-size="46" font-weight="700">NetworksV6</text>
  <text x="48" y="138" fill="#e9d5ff" font-family="system-ui,sans-serif" font-size="28" font-weight="600">Drake</text>
  <text x="48" y="172" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="14">PAPER 1.21.11 | SLIMEFUN DRAKE | JAVA 21</text>
  <text x="48" y="196" fill="#8b5cf6" font-family="system-ui,sans-serif" font-size="12">SlimefunNewHorizons</text>
  <rect x="748" y="36" width="132" height="34" rx="8" fill="#2e1065" stroke="#d4af37" stroke-width="1.2"/>
  <text x="814" y="58" fill="#f5d76e" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">v11-SNAPSHOT</text>
</svg>
